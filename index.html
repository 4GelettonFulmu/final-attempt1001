<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halftone Gesture Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        video {
            display: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <script>
        // Global elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // High saturation colors on RGB color wheel
        const colors = [
            { r: 255, g: 0, b: 0 },      // Red
            { r: 255, g: 128, b: 0 },    // Orange
            { r: 255, g: 255, b: 0 },    // Yellow
            { r: 128, g: 255, b: 0 },    // Lime
            { r: 0, g: 255, b: 0 },      // Green
            { r: 0, g: 255, b: 128 },    // Spring Green
            { r: 0, g: 255, b: 255 },    // Cyan
            { r: 0, g: 128, b: 255 },    // Azure
            { r: 0, g: 0, b: 255 },      // Blue
            { r: 128, g: 0, b: 255 },    // Violet
            { r: 255, g: 0, b: 255 },    // Magenta
            { r: 255, g: 0, b: 128 }     // Rose
        ];

        // State variables
        let currentColorIndex = 0;
        let targetColorIndex = 0;
        let colorTransition = 0;
        let currentColor = { ...colors[0] };

        let dotSize = 10;
        let targetDotSize = 10;
        const minDotSize = 4;
        const maxDotSize = 24;

        let dots = [];
        let isRunning = false;
        let currentVolume = 0;

        // Audio variables
        let audioContext, analyser, microphone, dataArray;
        let audioSensitivity = 2.0;

        // Hand tracking state
        let leftHandPrevPinchDist = null;
        let rightHandPrevPos = null;
        let swipeCooldown = 0;

        // Motion detection
        let prevImageData = null;
        let motionIntensity = 0;

        // Video processing canvas
        let videoCanvas, videoCtx;

        // Dot class - each dot is an independent element
        class Dot {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.baseY = y;
                this.size = size;
                this.brightness = 0;
                this.targetBrightness = 0;
                this.color = { ...currentColor };
                this.offsetX = 0;
                this.offsetY = 0;
                this.vibrationPhase = Math.random() * Math.PI * 2;
                this.rippleOffset = 0;
            }

            update(brightness, volume, rippleValue) {
                // Smooth brightness transition
                this.targetBrightness = brightness;
                this.brightness += (this.targetBrightness - this.brightness) * 0.3;

                // Smooth color transition
                this.color.r += (currentColor.r - this.color.r) * 0.15;
                this.color.g += (currentColor.g - this.color.g) * 0.15;
                this.color.b += (currentColor.b - this.color.b) * 0.15;

                // Ripple offset
                this.rippleOffset = rippleValue;

                // Vibration effect based on volume
                const combinedIntensity = Math.max(volume, motionIntensity * 0.5);
                if (combinedIntensity > 0.05) {
                    const vibrationIntensity = combinedIntensity * 4;
                    this.vibrationPhase += 0.2 + combinedIntensity * 0.3;
                    this.offsetX = Math.sin(this.vibrationPhase) * vibrationIntensity;
                    this.offsetY = Math.cos(this.vibrationPhase * 1.3) * vibrationIntensity;
                } else {
                    // Smoothly return to original position
                    this.offsetX *= 0.85;
                    this.offsetY *= 0.85;
                }
            }

            draw(ctx, size) {
                const effectiveBrightness = Math.max(0, Math.min(1, this.brightness + this.rippleOffset * 0.1));
                const radius = (size / 2) * effectiveBrightness * 0.95;

                if (radius > 0.5) {
                    ctx.fillStyle = `rgb(${Math.floor(this.color.r)}, ${Math.floor(this.color.g)}, ${Math.floor(this.color.b)})`;
                    ctx.beginPath();
                    ctx.arc(
                        this.baseX + this.offsetX,
                        this.baseY + this.offsetY,
                        radius,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            }
        }

        // Ripple system
        let ripples = [];

        function addRipple(x, y, intensity) {
            ripples.push({
                x: x,
                y: y,
                radius: 0,
                maxRadius: 100 + intensity * 80,
                intensity: intensity,
                life: 1
            });

            if (ripples.length > 30) {
                ripples = ripples.slice(-30);
            }
        }

        function updateRipples() {
            ripples = ripples.filter(ripple => {
                ripple.radius += 4;
                ripple.life -= 0.025;
                return ripple.life > 0 && ripple.radius < ripple.maxRadius;
            });
        }

        function getRippleValue(x, y) {
            let value = 0;
            ripples.forEach(ripple => {
                const dist = Math.hypot(x - ripple.x, y - ripple.y);
                const rippleWidth = 40;
                if (Math.abs(dist - ripple.radius) < rippleWidth) {
                    const wave = Math.sin((dist - ripple.radius) / rippleWidth * Math.PI);
                    value += wave * ripple.intensity * ripple.life * 3;
                }
            });
            return value;
        }

        // Resize handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            if (videoCanvas) {
                videoCanvas.width = canvas.width;
                videoCanvas.height = canvas.height;
            }

            initDots();
        }

        // Initialize dots grid
        function initDots() {
            dots = [];
            const spacing = dotSize * 1.5;
            const cols = Math.ceil(canvas.width / spacing) + 1;
            const rows = Math.ceil(canvas.height / spacing) + 1;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * spacing + spacing / 2;
                    const y = row * spacing + spacing / 2;
                    dots.push(new Dot(x, y, dotSize));
                }
            }
        }

        // Rebuild dots when dot size changes significantly
        function rebuildDots() {
            const spacing = dotSize * 1.5;
            const cols = Math.ceil(canvas.width / spacing) + 1;
            const rows = Math.ceil(canvas.height / spacing) + 1;
            const newDotCount = cols * rows;

            // Only rebuild if significant change
            if (Math.abs(dots.length - newDotCount) > 50) {
                dots = [];
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const x = col * spacing + spacing / 2;
                        const y = row * spacing + spacing / 2;
                        dots.push(new Dot(x, y, dotSize));
                    }
                }
            } else {
                // Just update positions
                let index = 0;
                for (let row = 0; row < rows && index < dots.length; row++) {
                    for (let col = 0; col < cols && index < dots.length; col++) {
                        dots[index].baseX = col * spacing + spacing / 2;
                        dots[index].baseY = row * spacing + spacing / 2;
                        index++;
                    }
                }
            }
        }

        window.addEventListener('resize', resize);

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);

        // Hand detection handler
        function onHandResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                leftHandPrevPinchDist = null;
                rightHandPrevPos = null;
                return;
            }

            let leftHand = null;
            let rightHand = null;

            results.multiHandLandmarks.forEach((landmarks, index) => {
                const handedness = results.multiHandedness[index].label;
                if (handedness === 'Right') {
                    leftHand = landmarks;
                } else {
                    rightHand = landmarks;
                }
            });

            // Left hand: pinch to change dot size
            if (leftHand) {
                const thumb = leftHand[4];
                const indexFinger = leftHand[8];
                const pinchDist = Math.hypot(thumb.x - indexFinger.x, thumb.y - indexFinger.y);

                if (leftHandPrevPinchDist !== null) {
                    const delta = (pinchDist - leftHandPrevPinchDist) * 150;
                    targetDotSize = Math.max(minDotSize, Math.min(maxDotSize, targetDotSize + delta));
                }

                leftHandPrevPinchDist = pinchDist;
            } else {
                leftHandPrevPinchDist = null;
            }

            // Right hand: swipe to change color
            if (rightHand) {
                const palm = rightHand[9];

                if (rightHandPrevPos !== null && swipeCooldown <= 0) {
                    const dx = palm.x - rightHandPrevPos.x;
                    const dy = palm.y - rightHandPrevPos.y;
                    const speed = Math.hypot(dx, dy);

                    if (speed > 0.04) {
                        if (Math.abs(dx) > Math.abs(dy)) {
                            if (dx > 0) {
                                targetColorIndex = (currentColorIndex + 1) % colors.length;
                            } else {
                                targetColorIndex = (currentColorIndex - 1 + colors.length) % colors.length;
                            }
                        } else {
                            if (dy > 0) {
                                targetColorIndex = (currentColorIndex + 3) % colors.length;
                            } else {
                                targetColorIndex = (currentColorIndex - 3 + colors.length) % colors.length;
                            }
                        }
                        colorTransition = 0;
                        swipeCooldown = 25;
                    }
                }

                rightHandPrevPos = { x: palm.x, y: palm.y };
            } else {
                rightHandPrevPos = null;
            }

            if (swipeCooldown > 0) swipeCooldown--;
        }

        // Initialize audio
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);

                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                microphone.connect(analyser);

                return true;
            } catch (err) {
                console.log('Audio not available:', err);
                return false;
            }
        }

        // Get audio volume
        function getVolume() {
            if (!analyser) return 0;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            return (average / 255) * audioSensitivity;
        }

        // Motion detection
        function detectMotion(currentData, prevData) {
            if (!prevData) return [];

            const width = canvas.width;
            const height = canvas.height;
            const gridSize = 50;
            const motionPoints = [];
            let totalMotion = 0;

            for (let y = 0; y < height; y += gridSize) {
                for (let x = 0; x < width; x += gridSize) {
                    let motionSum = 0;
                    let count = 0;

                    for (let dy = 0; dy < gridSize && y + dy < height; dy += 8) {
                        for (let dx = 0; dx < gridSize && x + dx < width; dx += 8) {
                            const i = ((y + dy) * width + (x + dx)) * 4;
                            const diff = Math.abs(currentData.data[i] - prevData.data[i]) +
                                        Math.abs(currentData.data[i + 1] - prevData.data[i + 1]) +
                                        Math.abs(currentData.data[i + 2] - prevData.data[i + 2]);
                            motionSum += diff;
                            count++;
                        }
                    }

                    const avgMotion = motionSum / count;
                    totalMotion += avgMotion;

                    if (avgMotion > 40) {
                        motionPoints.push({
                            x: x + gridSize / 2,
                            y: y + gridSize / 2,
                            intensity: Math.min(avgMotion / 100, 1)
                        });
                    }
                }
            }

            motionIntensity = Math.min(totalMotion / (width * height) * 10, 1);
            return motionPoints;
        }

        // Color interpolation
        function lerpColor(c1, c2, t) {
            return {
                r: Math.round(c1.r + (c2.r - c1.r) * t),
                g: Math.round(c1.g + (c2.g - c1.g) * t),
                b: Math.round(c1.b + (c2.b - c1.b) * t)
            };
        }

        // Get brightness from video at position
        function getBrightness(x, y, imageData) {
            const mirroredX = canvas.width - x;
            const sampleX = Math.floor(mirroredX);
            const sampleY = Math.floor(y);

            if (sampleX >= 0 && sampleX < canvas.width && sampleY >= 0 && sampleY < canvas.height) {
                const i = (sampleY * canvas.width + sampleX) * 4;
                const r = imageData.data[i];
                const g = imageData.data[i + 1];
                const b = imageData.data[i + 2];
                return (r + g + b) / 3 / 255;
            }
            return 0;
        }

        // Main render loop
        async function render() {
            if (!isRunning) return;

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Smooth dot size transition
            const prevDotSize = dotSize;
            dotSize += (targetDotSize - dotSize) * 0.08;

            // Rebuild dots if size changed significantly
            if (Math.abs(dotSize - prevDotSize) > 0.5) {
                rebuildDots();
            }

            // Smooth color transition
            if (currentColorIndex !== targetColorIndex) {
                colorTransition += 0.03;
                if (colorTransition >= 1) {
                    colorTransition = 0;
                    currentColorIndex = targetColorIndex;
                    currentColor = { ...colors[currentColorIndex] };
                } else {
                    currentColor = lerpColor(colors[currentColorIndex], colors[targetColorIndex], colorTransition);
                }
            }

            // Get audio volume
            currentVolume = getVolume();

            // Process video
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Draw video to offscreen canvas
                const videoAspect = video.videoWidth / video.videoHeight;
                const canvasAspect = canvas.width / canvas.height;

                let drawWidth, drawHeight, drawX, drawY;

                if (videoAspect > canvasAspect) {
                    drawHeight = canvas.height;
                    drawWidth = drawHeight * videoAspect;
                    drawX = (canvas.width - drawWidth) / 2;
                    drawY = 0;
                } else {
                    drawWidth = canvas.width;
                    drawHeight = drawWidth / videoAspect;
                    drawX = 0;
                    drawY = (canvas.height - drawHeight) / 2;
                }

                videoCtx.drawImage(video, drawX, drawY, drawWidth, drawHeight);
                const imageData = videoCtx.getImageData(0, 0, canvas.width, canvas.height);

                // Detect motion and add ripples
                const motionPoints = detectMotion(imageData, prevImageData);
                motionPoints.forEach(point => {
                    if (Math.random() < 0.2) {
                        addRipple(point.x, point.y, point.intensity);
                    }
                });

                prevImageData = imageData;

                // Update ripples
                updateRipples();

                // Update and draw dots
                const spacing = dotSize * 1.5;
                dots.forEach((dot, index) => {
                    // Recalculate position based on current spacing
                    const cols = Math.ceil(canvas.width / spacing) + 1;
                    const row = Math.floor(index / cols);
                    const col = index % cols;

                    dot.baseX = col * spacing + spacing / 2;
                    dot.baseY = row * spacing + spacing / 2;

                    const brightness = getBrightness(dot.baseX, dot.baseY, imageData);
                    const rippleValue = getRippleValue(dot.baseX, dot.baseY);

                    dot.update(brightness, currentVolume, rippleValue);
                    dot.draw(ctx, dotSize);
                });

                // Process hands
                await hands.send({ image: video });
            }

            requestAnimationFrame(render);
        }

        // Initialize camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });

                video.srcObject = stream;

                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve(true);
                    };
                });
            } catch (err) {
                console.error('Camera access denied:', err);
                return false;
            }
        }

        // Start application
        async function start() {
            // Setup offscreen video canvas
            videoCanvas = document.createElement('canvas');
            videoCtx = videoCanvas.getContext('2d');

            // Resize and init
            resize();

            // Init camera
            const cameraOk = await initCamera();
            if (!cameraOk) return;

            // Init audio (optional)
            await initAudio();

            // Start rendering
            isRunning = true;
            render();
        }

        // Initialize
        start();

        // Fullscreen on click
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        document.addEventListener('fullscreenchange', resize);
    </script>
</body>
</html>
