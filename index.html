<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halftone Gesture Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        video {
            display: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        <canvas id="prevFrame" style="display:none;"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const prevFrameCanvas = document.getElementById('prevFrame');
        const prevCtx = prevFrameCanvas.getContext('2d');

        // High saturation colors on RGB color wheel
        const colors = [
            [255, 0, 0],     // Red
            [255, 128, 0],   // Orange
            [255, 255, 0],   // Yellow
            [128, 255, 0],   // Lime
            [0, 255, 0],     // Green
            [0, 255, 128],   // Spring Green
            [0, 255, 255],   // Cyan
            [0, 128, 255],   // Azure
            [0, 0, 255],     // Blue
            [128, 0, 255],   // Violet
            [255, 0, 255],   // Magenta
            [255, 0, 128]    // Rose
        ];

        let currentColorIndex = 0;
        let targetColorIndex = 0;
        let colorTransition = 0;
        let currentColor = [...colors[0]];

        let dotSize = 8;
        let targetDotSize = 8;
        const minDotSize = 4;
        const maxDotSize = 20;

        let motionData = [];
        let ripples = [];

        // Hand tracking state
        let leftHandPinchDist = null;
        let leftHandPrevPinchDist = null;
        let rightHandPrevPos = null;
        let swipeCooldown = 0;

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            prevFrameCanvas.width = window.innerWidth;
            prevFrameCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);

        // Hand detection results handler
        function onHandResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                leftHandPinchDist = null;
                leftHandPrevPinchDist = null;
                rightHandPrevPos = null;
                return;
            }

            let leftHand = null;
            let rightHand = null;

            results.multiHandLandmarks.forEach((landmarks, index) => {
                const handedness = results.multiHandedness[index].label;
                // Mirror the handedness since webcam is mirrored
                if (handedness === 'Right') {
                    leftHand = landmarks;
                } else {
                    rightHand = landmarks;
                }
            });

            // Left hand: pinch to zoom (change dot size)
            if (leftHand) {
                const thumb = leftHand[4];
                const index = leftHand[8];
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

                if (leftHandPrevPinchDist !== null) {
                    const delta = (pinchDist - leftHandPrevPinchDist) * 100;
                    targetDotSize = Math.max(minDotSize, Math.min(maxDotSize, targetDotSize + delta));
                }

                leftHandPrevPinchDist = pinchDist;
            } else {
                leftHandPrevPinchDist = null;
            }

            // Right hand: swipe to change color
            if (rightHand) {
                const palm = rightHand[9]; // Middle finger MCP as palm center

                if (rightHandPrevPos !== null && swipeCooldown <= 0) {
                    const dx = palm.x - rightHandPrevPos.x;
                    const dy = palm.y - rightHandPrevPos.y;
                    const speed = Math.hypot(dx, dy);

                    if (speed > 0.05) {
                        // Determine swipe direction
                        if (Math.abs(dx) > Math.abs(dy)) {
                            // Horizontal swipe
                            if (dx > 0) {
                                targetColorIndex = (currentColorIndex + 1) % colors.length;
                            } else {
                                targetColorIndex = (currentColorIndex - 1 + colors.length) % colors.length;
                            }
                        } else {
                            // Vertical swipe
                            if (dy > 0) {
                                targetColorIndex = (currentColorIndex + 3) % colors.length;
                            } else {
                                targetColorIndex = (currentColorIndex - 3 + colors.length) % colors.length;
                            }
                        }
                        colorTransition = 0;
                        swipeCooldown = 30;
                    }
                }

                rightHandPrevPos = { x: palm.x, y: palm.y };
            } else {
                rightHandPrevPos = null;
            }

            if (swipeCooldown > 0) swipeCooldown--;
        }

        // Detect motion and create ripples
        function detectMotion(currentImageData, prevImageData) {
            const width = canvas.width;
            const height = canvas.height;
            const gridSize = 40;
            const motionPoints = [];

            for (let y = 0; y < height; y += gridSize) {
                for (let x = 0; x < width; x += gridSize) {
                    let motionSum = 0;
                    let count = 0;

                    for (let dy = 0; dy < gridSize && y + dy < height; dy += 4) {
                        for (let dx = 0; dx < gridSize && x + dx < width; dx += 4) {
                            const i = ((y + dy) * width + (x + dx)) * 4;
                            const diff = Math.abs(currentImageData.data[i] - prevImageData.data[i]) +
                                        Math.abs(currentImageData.data[i + 1] - prevImageData.data[i + 1]) +
                                        Math.abs(currentImageData.data[i + 2] - prevImageData.data[i + 2]);
                            motionSum += diff;
                            count++;
                        }
                    }

                    const avgMotion = motionSum / count;
                    if (avgMotion > 30) {
                        motionPoints.push({
                            x: x + gridSize / 2,
                            y: y + gridSize / 2,
                            intensity: Math.min(avgMotion / 100, 1)
                        });
                    }
                }
            }

            return motionPoints;
        }

        // Add ripples from motion
        function addRipples(motionPoints) {
            motionPoints.forEach(point => {
                if (Math.random() < 0.3) {
                    ripples.push({
                        x: point.x,
                        y: point.y,
                        radius: 0,
                        maxRadius: 80 + point.intensity * 60,
                        intensity: point.intensity,
                        life: 1
                    });
                }
            });

            // Limit ripples
            if (ripples.length > 50) {
                ripples = ripples.slice(-50);
            }
        }

        // Update ripples
        function updateRipples() {
            ripples = ripples.filter(ripple => {
                ripple.radius += 3;
                ripple.life -= 0.02;
                return ripple.life > 0 && ripple.radius < ripple.maxRadius;
            });
        }

        // Get ripple offset at position
        function getRippleOffset(x, y) {
            let offset = 0;

            ripples.forEach(ripple => {
                const dist = Math.hypot(x - ripple.x, y - ripple.y);
                const rippleWidth = 30;

                if (Math.abs(dist - ripple.radius) < rippleWidth) {
                    const wave = Math.sin((dist - ripple.radius) / rippleWidth * Math.PI);
                    offset += wave * ripple.intensity * ripple.life * 4;
                }
            });

            return offset;
        }

        // Interpolate colors
        function lerpColor(color1, color2, t) {
            return [
                Math.round(color1[0] + (color2[0] - color1[0]) * t),
                Math.round(color1[1] + (color2[1] - color1[1]) * t),
                Math.round(color1[2] + (color2[2] - color1[2]) * t)
            ];
        }

        // Draw halftone effect
        function drawHalftone(imageData) {
            const width = canvas.width;
            const height = canvas.height;

            // Clear to black
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Smooth dot size transition
            dotSize += (targetDotSize - dotSize) * 0.1;

            // Smooth color transition
            if (currentColorIndex !== targetColorIndex) {
                colorTransition += 0.02;
                if (colorTransition >= 1) {
                    colorTransition = 0;
                    currentColorIndex = targetColorIndex;
                    currentColor = [...colors[currentColorIndex]];
                } else {
                    currentColor = lerpColor(colors[currentColorIndex], colors[targetColorIndex], colorTransition);
                }
            }

            const spacing = dotSize * 1.5;
            const data = imageData.data;

            for (let y = spacing / 2; y < height; y += spacing) {
                for (let x = spacing / 2; x < width; x += spacing) {
                    // Get brightness at this point (mirrored)
                    const mirroredX = width - x;
                    const sampleX = Math.floor(mirroredX);
                    const sampleY = Math.floor(y);

                    if (sampleX >= 0 && sampleX < width && sampleY >= 0 && sampleY < height) {
                        const i = (sampleY * width + sampleX) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const brightness = (r + g + b) / 3 / 255;

                        // Get ripple effect
                        const rippleOffset = getRippleOffset(x, y);

                        // Calculate dot radius based on brightness
                        const maxRadius = (dotSize / 2) * 0.95;
                        let radius = brightness * maxRadius + rippleOffset;
                        radius = Math.max(0, Math.min(maxRadius, radius));

                        if (radius > 0.5) {
                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.fillStyle = `rgb(${currentColor[0]}, ${currentColor[1]}, ${currentColor[2]})`;
                            ctx.fill();
                        }
                    }
                }
            }
        }

        // Main render loop
        let prevImageData = null;

        async function render() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Draw video to hidden canvas for processing
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');

                // Draw and scale video to fill canvas
                const videoAspect = video.videoWidth / video.videoHeight;
                const canvasAspect = canvas.width / canvas.height;

                let drawWidth, drawHeight, drawX, drawY;

                if (videoAspect > canvasAspect) {
                    drawHeight = canvas.height;
                    drawWidth = drawHeight * videoAspect;
                    drawX = (canvas.width - drawWidth) / 2;
                    drawY = 0;
                } else {
                    drawWidth = canvas.width;
                    drawHeight = drawWidth / videoAspect;
                    drawX = 0;
                    drawY = (canvas.height - drawHeight) / 2;
                }

                tempCtx.drawImage(video, drawX, drawY, drawWidth, drawHeight);
                const imageData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);

                // Detect motion
                if (prevImageData) {
                    const motionPoints = detectMotion(imageData, prevImageData);
                    addRipples(motionPoints);
                }

                // Update ripples
                updateRipples();

                // Draw halftone
                drawHalftone(imageData);

                // Store current frame for motion detection
                prevImageData = imageData;

                // Process hands
                await hands.send({ image: video });
            }

            requestAnimationFrame(render);
        }

        // Initialize camera
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });

                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    render();
                };
            } catch (err) {
                console.error('Camera access denied:', err);
            }
        }

        // Start application
        init();

        // Fullscreen on click
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        // Handle fullscreen change
        document.addEventListener('fullscreenchange', resize);
    </script>
</body>
</html>
